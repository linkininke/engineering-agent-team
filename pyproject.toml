[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-agent-team"
version = "0.1.0"
description = "Approval-driven engineering agent team MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
openai = ["openai-agents>=0.2,<1"]

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.setuptools.packages.find]
include = ["agent_team*"]
